# Checks the plugin on every push and pull request. Pushing a tag such as
# v2.0.0 (plugin.json's version) packs it into a GitHub release, which
# Dalibre installs and updates from: Plugins › Add plugin › From GitHub.
name: Plugin
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g dalibre-plugin@^0.6.0
      - name: Check
        # Validates plugin.json and main.js, downloads every platform's zlib
        # build and checks it against plugin.json.
        run: dalibre-plugin check .
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./plugin.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but plugin.json's version is $version"
            exit 1
          fi
          mkdir -p dist
          dalibre-plugin pack . -o dist
          gh release create "$GITHUB_REF_NAME" dist/zlib.books-"$version".dalibre-plugin --title "$GITHUB_REF_NAME" --generate-notes
